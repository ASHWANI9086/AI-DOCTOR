# ═══════════════════════════════════════════════════════════════
#  nginx.conf — Reverse Proxy for VisionaryCare AI Doctor
#  Routes: Internet (port 80) → Gradio app (port 7860)
# ═══════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript;

    # ── Upload size (for medical image uploads) ───────────────────
    client_max_body_size 50M;

    # ── Upstream: Gradio app container ────────────────────────────
    upstream gradio_app {
        server ai-doctor:7860;
        keepalive 32;
    }

    # ── HTTP Server ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;   # catches any hostname / raw IP

        # ── Security Headers ───────────────────────────────────────
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer"   always;

        # ── WebSocket support (REQUIRED for Gradio live queue) ─────
        # Gradio uses websockets for real-time updates
        location / {
            proxy_pass         http://gradio_app;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forwarding headers
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            # Timeouts (Gradio inference can take time)
            proxy_connect_timeout   60s;
            proxy_send_timeout      120s;
            proxy_read_timeout      120s;

            # Buffer settings
            proxy_buffering         off;
            proxy_cache_bypass      $http_upgrade;
        }

        # ── Gradio file serving endpoint ───────────────────────────
        location /file= {
            proxy_pass         http://gradio_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 60s;
        }

        # ── Gradio API endpoint ────────────────────────────────────
        location /gradio_api/ {
            proxy_pass         http://gradio_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Health check endpoint ──────────────────────────────────
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ── HTTPS Server (uncomment after Let's Encrypt setup) ────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # (same location blocks as above)
    # }
}
